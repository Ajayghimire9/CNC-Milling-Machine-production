services:
  forgepulse:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - forgepulse
