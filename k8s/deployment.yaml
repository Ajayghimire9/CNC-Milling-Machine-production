apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgepulse
spec:
  replicas: 2
  selector:
    matchLabels: {app: forgepulse}
  template:
    metadata:
      labels: {app: forgepulse}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/ajayghimire9/forgepulse:latest
          ports:
            - containerPort: 8000
          env:
            - name: FORGEPULSE_MODEL
              value: /app/artifacts/forgepulse.joblib
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: forgepulse
spec:
  selector: {app: forgepulse}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgepulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgepulse
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
